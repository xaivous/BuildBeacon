# Builds the BuildBeacon site (tools/site/build_site.py) and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "tools/site/**"
      - "tools/balance/matrix_data.py"
      - "BuildBeacon/BeaconConfig.cs"
      - "BuildBeacon/BuildBeaconPlugin.cs"
      - "BuildBeaconUnity/Assets/Beacon/*.png"
      - "README.md"
      - "BuildBeacon/CHANGELOG.md"
      - "ROADMAP.md"
      - "BuildBeacon/Package/manifest.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python tools/site/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
